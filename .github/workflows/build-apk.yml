name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add native 3D packages via expo install
        run: npx expo install expo-gl expo-three three

      - name: Fix Expo dependency versions
        run: npx expo install --fix

      - name: Init EAS project (creates if missing)
        run: eas init --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK with EAS (wait for result)
        run: eas build --platform android --profile preview --non-interactive --wait --json > build-result.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Extract APK download URL
        id: extract
        run: |
          URL=$(cat build-result.json | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(Array.isArray(d)?d[0].artifacts.buildUrl:d.artifacts.buildUrl)")
          echo "apk_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -L "${{ steps.extract.outputs.apk_url }}" -o astran-game.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: astran-game-apk
          path: frontend/astran-game.apk
          retention-days: 30